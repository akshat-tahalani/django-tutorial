<!DOCTYPE html>
<html>
<head>
    <title>Review: {{ product.title }}</title>
    <style>
        .error-message {
            color: red;
            font-weight: bold;
            padding: 8px;
            background-color: #ffe6e6;
            border-left: 4px solid red;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Review: {{ product.title }}</h1>
    <form method="POST">
    {% csrf_token %}
    
    <div>
        <label>{{ form.name.label }}</label>
        {{ form.name }}
        {% if form.name.errors %}
            <p class="error-message">{{ form.name.errors }}</p>
        {% endif %}
    </div>
    
    <div>
        <label>{{ form.rating.label }}</label>
        {{ form.rating }}
        {% if form.rating.errors %}
            <p class="error-message">{{ form.rating.errors }}</p>
        {% endif %}
    </div>
    
    <div>
        <label>{{ form.comment.label }}</label>
        {{ form.comment }}
        {% if form.comment.errors %}
            <p class="error-message">{{ form.comment.errors }}</p>
        {% endif %}
    </div>
    
    <button type="submit">Submit Review</button>
</form>
</body>
</html>
